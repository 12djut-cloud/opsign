name: Build, sign and publish OPsign
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
    defaults:
      run:
        working-directory: OPsign
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        working-directory: .
        run: unzip -q OPsign.zip

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project OPsign.xcodeproj -scheme OPsign \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Sign with your certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          APP=build/Build/Products/Release-iphoneos/OPsign.app
          echo "$P12_BASE64" | base64 --decode > cert.p12
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security cms -D -i profile.mobileprovision > profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' profile.plist > ent.plist
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | head -1 | awk -F'"' '{print $2}')
          cp profile.mobileprovision "$APP/embedded.mobileprovision"
          codesign -f -s "$IDENTITY" --entitlements ent.plist "$APP"
          mkdir -p site Payload
          cp -R "$APP" Payload/
          zip -qr site/OPsign.ipa Payload

      - name: Build install page
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          BASE="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          sed "s|__BASE__|$BASE|g" web/index.html > site/index.html
          sed -e "s|__BASE__|$BASE|g" -e "s|__BUNDLE_ID__|$BUNDLE_ID|g" web/manifest.plist > site/manifest.plist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: OPsign/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
